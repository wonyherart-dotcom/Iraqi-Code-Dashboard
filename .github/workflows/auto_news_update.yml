name: 실시간 AI 뉴스 자동 업데이트

on:
  schedule:
    # 매일 UTC 00:00, 06:00, 12:00, 18:00 (한국 시간 기준 09시, 15시, 21시, 03시)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # 수동으로 즉시 실행할 수 있는 버튼 활성화

permissions:
  contents: write # 갱신된 JSON 파일을 GitHub에 자동 푸시하기 위한 권한

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install google-generativeai

      - name: 뉴스 크롤링 및 AI 요약 스크립트 실행
        env:
          NAVER_CLIENT_ID: ${{ 0Hna0veoqRLZ3xiu19lm }}
          NAVER_CLIENT_SECRET: ${{ XHURNB2C9T }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      - name: 변경된 news.json 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AI news [$(date +'%Y-%m-%d %H:%M')]" && git push)
